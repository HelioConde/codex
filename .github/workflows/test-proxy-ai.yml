name: Testar cliente local do proxy (sem chamadas de IA)
on:
  push:
    paths:
      - 'proxy_ai/**'
      - 'tests/**'
      - '.github/workflows/test-proxy-ai.yml'
  pull_request:
    paths:
      - 'proxy_ai/**'
      - 'tests/**'
      - '.github/workflows/test-proxy-ai.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar sem chaves, sem rede e sem IA
        run: python -m unittest discover -s tests -v
