name: Testar cliente local do proxy (sem chamadas de IA)
on:
  push:
    paths:
      - 'proxy_ai/**'
      - 'tests/**'
      - 'scripts/configurar-proxy-existente.ps1'
      - '.github/workflows/test-proxy-ai.yml'
  pull_request:
    paths:
      - 'proxy_ai/**'
      - 'tests/**'
      - '.github/workflows/test-proxy-ai.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar sem chaves, sem rede e sem IA
        run: python -m unittest discover -s tests -v
      - name: Validar sintaxe do script PowerShell sem usar credenciais
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/configurar-proxy-existente.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'Script PowerShell invalido'
          }
